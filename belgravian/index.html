:root[data-theme="dark"] .bv.bv-themed{--ink:#f2ece4;--body:#d6cec4;--slate:#b0a79c;--claret:#e07a8f;--gold:#d6b97a;--gold-ink:#d6b97a;--rule:#3b3433;--cream:#2a2423;--sand:#3a312c;--hover:#2f2827;--paper:#1b1716;--scan-bg:#262120;--hl:rgba(214,185,122,.22);--hl-line:#d6b97a}
.bv *{box-sizing:border-box}

.bv-item .by{font:500 14px/20px var(--text);color:var(--slate);margin:0}
.bv-item .cont{font:500 14px/20px var(--text);color:var(--slate);margin:0}

.bv-prose{display:grid;gap:14px;max-width:66ch}

.bv-fig{margin:0;display:grid;gap:6px}

.bv-person-head h2{font:300 54px/1 var(--titling);text-transform:uppercase;letter-spacing:-.01em}

.bv-story h3{font:600 20px/25px var(--franklin);margin:12px 0 0}

.bv-timeline{display:grid;gap:0;border-top:3px solid var(--gold)}
.bv-tl{display:grid;grid-template-columns:132px minmax(0,1fr);gap:16px;padding:12px 0;border-bottom:1px solid var(--rule)}

.bv-tl a:hover{color:var(--claret)}
.bv-tl p{margin:2px 0 0;font:400 14px/20px var(--text);color:var(--slate)}

.bv-src{font:400 13px/18px var(--text);color:var(--slate);max-width:70ch}
.bv-note{font:400 13px/18px var(--text);color:var(--slate);margin:24px 0 0;max-width:70ch}

/* lightbox */
.bv-lb{position:fixed;inset:0;z-index:1000;background:rgba(20,16,15,.92);display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bv-lb figure{margin:0;display:grid;gap:10px;max-width:min(1100px,100%);max-height:100%}

<div id="bh-belgravian" class="bv">
  <header class="bv-mast">
    <div class="rule2" aria-hidden="true"></div>
    <span class="label">Belgrave Harriers · Founded 1887</span>
    <h1><a href="#shelf">The Belgravian</a></h1>
    <p>The club’s own gazette, from its first issue in April 1925 to its last in 2009. Read every page as it was printed, beside a clean, searchable version.</p>
    <form class="bv-search" role="search">
      <input id="bv-q" type="search" placeholder="Search names, races, places…" aria-label="Search The Belgravian" autocomplete="off">
      <button type="submit">Search</button>
    </form>
  </header>
  <nav class="bv-crumbs" aria-label="Where you are"></nav>
  <main class="bv-main" aria-live="polite"><p class="bv-msg">Loading the archive…</p></main>
</div>

<script>
(function(){
  var root=document.getElementById('bh-belgravian');if(!root||root.dataset.ready)return;root.dataset.ready='1';
  var BASE=(window.BV_BASE!==undefined)?window.BV_BASE:'https://stephengardner1.github.io/belgrave-harriers-data/belgravian/';
  var MEDIA=(window.BV_MEDIA!==undefined)?window.BV_MEDIA:'https://pub-16e146f74e014d32bd956564b0563306.r2.dev/belgravian/';
  var main=root.querySelector('.bv-main'),crumbs=root.querySelector('.bv-crumbs'),q=root.querySelector('#bv-q');
  var IDX=null,ISSUES={},SEARCH=null,PEOPLE=null,LEGENDS={},pane='text';
  var TYPE={cover:'Cover',masthead:'Masthead',editorial:'Editorial',report:'Report',results:'Results',notice:'Notice',letter:'Letter',obituary:'Obituary',members:'New members',feature:'Feature',column:'Column',records:'Records',photo:'Photograph',advert:'Advertisement',poem:'Poem',cartoon:'Cartoon',other:'Item'};

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function get(path){return fetch(BASE+path).then(function(r){if(!r.ok)throw new Error(path);return r.json()})}
  function slug(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
  function pad(n){return n<10?'0'+n:''+n}
  function pageImg(no,p){return MEDIA+'pages/B'+no+'/B'+no+'-p'+pad(p)+'.webp'}
  function issueKey(no){return 'B'+no}
  function go(h){if(location.hash==='#'+h)route();else location.hash=h}
  function crumbsSet(list){crumbs.innerHTML=list.map(function(c,i){return (i?'<span aria-hidden="true">/</span>':'')+(c[1]?'<a href="#'+c[1]+'">'+esc(c[0])+'</a>':'<span>'+esc(c[0])+'</span>')}).join('')}
  function personHref(name){var id='p-'+slug(name);return PEOPLE&&PEOPLE.byId[id]?'#'+id:null}

  /* ---------- shelf ---------- */
  function shelf(){
    crumbsSet([['All issues','']]);
    var by={};IDX.issues.forEach(function(x){var d=Math.floor(x.year/10)*10;(by[d]=by[d]||[]).push(x)});
    var h='<div class="bv-shelf">';
    if(IDX.legends&&IDX.legends.length){
      h+='<section class="bv-decade"><header><h2>Legends</h2><p>Great Belgravians, told through the pages of their club gazette.</p></header><div class="bv-legends">'+
        IDX.legends.map(function(l){return '<a class="bv-legend-card" href="#'+l.id+'">'+(l.photo?'<img src="'+MEDIA+esc(l.photo)+'" alt="'+esc(l.name)+'" loading="lazy">':'')+'<b>'+esc(l.name)+'</b><span>'+esc(l.line)+'</span></a>'}).join('')+'</div></section>';
    }
    Object.keys(by).sort().forEach(function(d){
      var list=by[d].sort(function(a,b){return a.date<b.date?-1:1});
      h+='<section class="bv-decade" id="d'+d+'"><header><h2>'+d+'s</h2><p>'+list.length+(list.length===1?' issue':' issues')+'</p></header><div class="bv-covers">'+
        list.map(function(x){return '<a class="bv-cover" href="#'+issueKey(x.issue)+'"><img src="'+pageImg(x.issue,1)+'" alt="Cover of The Belgravian, '+esc(x.label)+'" loading="lazy"><b>'+esc(x.label)+'</b><span>No. '+x.issue+'</span></a>'}).join('')+'</div></section>';
    });
    if(IDX.coming)h+='<section class="bv-decade"><header><h2>Still to come</h2><p>These decades are being digitised. Meanwhile every issue is on <a href="https://www.belgraveharriers.info/thebelgravian">Alan Mead’s Belgrave history site</a>.</p></header><div class="bv-later">'+IDX.coming.map(function(c){return '<span>'+esc(c)+'</span>'}).join('')+'</div></section>';
    h+='<section class="bv-decade"><header><h2>People</h2><p>Everyone named in the digitised issues so far.</p></header><p><a href="#people">Browse all names</a></p></section>';
    main.innerHTML=h+'</div><p class="bv-note">Scans of every Belgravian are by Alan Mead, the club historian, at belgraveharriers.info. The readable text was transcribed from those scans; where the print is hard to read, the original is always beside it.</p>';
  }

  /* ---------- reader ---------- */
  function loadIssue(no){return ISSUES[no]?Promise.resolve(ISSUES[no]):get('issues/B'+no+'.json').then(function(d){ISSUES[no]=d;return d})}
  function itemsOnPage(d,p){return d.items.filter(function(it){return (it.pages||[]).indexOf(p)>=0})}
  function firstPage(it){return Math.min.apply(null,it.pages&&it.pages.length?it.pages:[1])}

  function tableHtml(t){
    var rows=t.rows||[];if(!rows.length)return '';
    var head=rows[0],body=rows.slice(1);
    var isNum=function(v){return /^[\d:.\s\-–]+$/.test(String(v))&&String(v).trim()!==''};
    return '<div class="bv-tablewrap"><table>'+(t.caption?'<caption>'+esc(t.caption)+'</caption>':'')+'<thead><tr>'+head.map(function(c){return '<th>'+esc(c)+'</th>'}).join('')+'</tr></thead><tbody>'+
      body.map(function(r){var us=r.some(function(c){return /belgrave/i.test(c)});return '<tr'+(us?' class="us"':'')+'>'+r.map(function(c){return '<td'+(isNum(c)?' class="num"':'')+'>'+esc(c)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>';
  }
  function figs(list,no,kind){
    list=(list||[]).filter(function(f){return !f.review});
    if(!list.length)return '';
    return '<div class="bv-figs">'+list.map(function(f){
      var src=MEDIA+'crops/B'+no+'/'+f.file;
      var cap=(kind==='scan'?'<b>Original printed results</b>'+(f.caption?' · '+esc(f.caption):''):esc(f.caption||''))+(f.credit?' <span>('+esc(f.credit)+')</span>':'');
      return '<figure class="bv-fig"><img src="'+src+'" alt="'+esc(f.caption||(kind==='scan'?'Scan of printed results':'Photograph'))+'" loading="lazy" data-lb="'+esc(src)+'" data-cap="'+esc(f.caption||'')+'">'+(cap?'<figcaption>'+cap+'</figcaption>':'')+'</figure>'}).join('')+'</div>';
  }
  function prose(text,hl){
    if(!text)return '';
    var re=hl?new RegExp('('+hl.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'):null;
    return '<div class="bv-prose">'+String(text).split(/\n\s*\n/).map(function(p){var e=esc(p.trim());if(re)e=e.replace(re,'<mark>$1</mark>');return '<p>'+e+'</p>'}).join('')+'</div>';
  }
  function chips(it){
    var seen={},ppl=(it.people||[]).filter(function(p){var k=p.name||p.printed;if(seen[k])return false;seen[k]=1;return true});
    var h='';
    if(ppl.length)h+='<div class="bv-chips" aria-label="People">'+ppl.map(function(p){var n=p.name||p.printed,href=personHref(n);return href?'<a class="bv-chip" href="'+href+'">'+esc(n)+'</a>':'<span class="bv-chip">'+esc(n)+'</span>'}).join('')+'</div>';
    var tags=[].concat(it.events||[],it.places||[]);
    if(tags.length)h+='<div class="bv-chips" aria-label="Events and places">'+tags.map(function(t){return '<button type="button" class="bv-chip tag" data-search="'+esc(t)+'">'+esc(t)+'</button>'}).join('')+'</div>';
    return h;
  }
  function itemHtml(it,d,p,hl){
    var fp=firstPage(it),cont=fp<p;
    var small=['advert','masthead','members','notice','cover'].indexOf(it.type)>=0;
    var h='<article class="bv-item" id="'+esc(it.id)+'" data-id="'+esc(it.id)+'"><span class="label">'+esc(TYPE[it.type]||'Item')+'</span>';
    h+=it.heading?'<h3'+(small?' class="small"':'')+'>'+esc(it.heading)+'</h3>':'';
    if(it.byline)h+='<p class="by">'+esc(it.byline)+'</p>';
    if(cont){return h+'<p class="cont">Continued from page '+fp+'. <button type="button" data-goitem="'+esc(it.id)+'">Read from the start</button></p></article>'}
    if(!it.heading&&it.summary)h+='<p class="sum">'+esc(it.summary)+'</p>';
    h+=prose(it.text,hl);
    (it.tables||[]).forEach(function(t){h+=tableHtml(t)});
    h+=figs(it.scans,d.issue,'scan')+figs(it.photos,d.issue,'photo');
    if((it.pages||[]).length>1)h+='<p class="cont">Runs over pages '+it.pages.join(', ')+'.</p>';
    h+=chips(it);
    h+='<button type="button" class="orig" data-orig="'+esc(it.id)+'">Show on the original page</button>';
    return h+'</article>';
  }
  function reader(no,p,focus,hl){
    loadIssue(no).then(function(d){
      p=Math.max(1,Math.min(d.pageCount,p||1));
      crumbsSet([['All issues','shelf'],[d.label+' · No. '+d.issue,issueKey(no)],['Page '+p,'']]);
      var items=itemsOnPage(d,p);
      var opts='';for(var i=1;i<=d.pageCount;i++)opts+='<option value="'+i+'"'+(i===p?' selected':'')+'>Page '+i+' of '+d.pageCount+'</option>';
      var h='<div class="bv-issuehead"><div><span class="label">No. '+d.issue+'</span><h2>'+esc(d.label)+'</h2><p class="meta">'+d.items.length+' items · '+d.pageCount+' pages'+(d.officers&&d.officers.President?' · President '+esc(d.officers.President):'')+'</p></div>'+
        '<div class="bv-pager"><button type="button" data-page="'+(p-1)+'"'+(p<=1?' disabled':'')+' aria-label="Previous page">←</button><select id="bv-page" aria-label="Page">'+opts+'</select><button type="button" data-page="'+(p+1)+'"'+(p>=d.pageCount?' disabled':'')+' aria-label="Next page">→</button></div></div>';
      h+='<div class="bv-seg" role="tablist" aria-label="View"><button role="tab" data-pane="text" aria-selected="'+(pane==='text')+'">Readable</button><button role="tab" data-pane="scan" aria-selected="'+(pane==='scan')+'">Original</button></div>';
      h+='<div class="bv-reader" data-pane="'+pane+'"><div class="bv-scanpane"><div class="bv-scanbox"><div class="bv-scan"><img src="'+pageImg(no,p)+'" alt="Page '+p+' of The Belgravian, '+esc(d.label)+', as printed">';
      items.forEach(function(it){(it.regions||[]).forEach(function(r){if(r.page!==p||!r.box)return;var b=r.box;
        h+='<button type="button" class="bv-region" data-id="'+esc(it.id)+'" aria-label="'+esc((TYPE[it.type]||'Item')+(it.heading?': '+it.heading:''))+'" style="left:'+(b[0]*100)+'%;top:'+(b[1]*100)+'%;width:'+((b[2]-b[0])*100)+'%;height:'+((b[3]-b[1])*100)+'%"></button>'})});
      h+='</div></div><div class="bv-scantools"><button type="button" data-zoom>Zoom in</button><a href="'+esc(d.pdfUrl||'#')+'#page='+p+'" target="_blank" rel="noopener">Open the full PDF</a></div></div>';
      h+='<div class="bv-textpane">'+(items.length?items.map(function(it){return itemHtml(it,d,p,hl)}).join(''):'<p class="bv-msg">Nothing has been transcribed from this page.</p>')+'</div></div>';
      main.innerHTML=h;
      var sel=main.querySelector('#bv-page');sel.addEventListener('change',function(){go(issueKey(no)+'-p'+pad(+sel.value))});
      if(focus)setTimeout(function(){on(focus,true)},30);else window.scrollTo&&root.scrollIntoView({block:'start'});
    }).catch(function(){main.innerHTML='<p class="bv-msg">That issue couldn’t be loaded just now. Please try again shortly.</p>'});
  }
  function on(id,scroll){
    main.querySelectorAll('.bv-region,.bv-item').forEach(function(e){e.classList.toggle('on',e.dataset.id===id)});
    if(scroll){var el=main.querySelector('.bv-item[data-id="'+id+'"]');if(el&&pane==='text')el.scrollIntoView({block:'start',behavior:'smooth'});
      var r=main.querySelector('.bv-region[data-id="'+id+'"]');var box=main.querySelector('.bv-scanbox');if(r&&box&&box.classList.contains('zoom'))r.scrollIntoView({block:'center',inline:'center'})}
  }
  function setPane(v){pane=v;var rd=main.querySelector('.bv-reader');if(rd)rd.dataset.pane=v;main.querySelectorAll('.bv-seg [data-pane]').forEach(function(b){b.setAttribute('aria-selected',b.dataset.pane===v?'true':'false')})}

  /* ---------- search ---------- */
  function loadSearch(){if(SEARCH)return Promise.resolve(SEARCH);var files=(IDX&&IDX.searchFiles&&IDX.searchFiles.length)?IDX.searchFiles:['search.json'];return Promise.all(files.map(function(f){return get(f)})).then(function(ds){SEARCH={items:[].concat.apply([],ds.map(function(d){return d.items}))};return SEARCH})}
  var filter='all';
  function search(term){
    term=(term||'').trim();crumbsSet([['All issues','shelf'],['Search','']]);
    if(!term){main.innerHTML='<p class="bv-msg">Type a name, race or place to search the digitised issues.</p>';return}
    main.innerHTML='<p class="bv-msg">Searching…</p>';
    loadSearch().then(function(S){
      var words=term.toLowerCase().split(/\s+/).filter(Boolean);
      S.items.forEach(function(x){if(!x.l)x.l=x.s.toLowerCase()});
      var hits=S.items.filter(function(x){return words.every(function(w){return x.l.indexOf(w)>=0})});
      var types={};hits.forEach(function(x){types[x.type]=(types[x.type]||0)+1});
      var shown=filter==='all'?hits:hits.filter(function(x){return x.type===filter});
      var h='<h2 style="margin:0 0 6px">'+hits.length+' result'+(hits.length===1?'':'s')+' for “'+esc(term)+'”</h2><p class="bv-msg" style="margin:0 0 14px">In the issues digitised so far.</p>';
      if(hits.length){h+='<div class="bv-filters"><button type="button" data-filter="all" aria-pressed="'+(filter==='all')+'">All</button>'+Object.keys(types).sort().map(function(t){return '<button type="button" data-filter="'+t+'" aria-pressed="'+(filter===t)+'">'+esc(TYPE[t]||t)+' · '+types[t]+'</button>'}).join('')+'</div>'}
      h+='<div class="bv-results">'+shown.slice(0,200).map(function(x){
        var src=x.s,i=x.l.indexOf(words[0]),snip=i>80?'…'+src.slice(i-70,i+170)+'…':src.slice(0,240)+(src.length>240?'…':'');
        var e=esc(snip);words.forEach(function(w){e=e.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>')});
        return '<a class="bv-hit" href="#'+x.id+'" data-hl="'+esc(words[0])+'"><span class="label">'+esc(TYPE[x.type]||'Item')+' · '+esc(x.label)+' · page '+x.p+'</span><h3>'+esc(x.h||x.sum||'Untitled item')+'</h3><p>'+e+'</p></a>'}).join('')+'</div>';
      if(shown.length>200)h+='<p class="bv-msg">Showing the first 200. Add another word to narrow the search.</p>';
      main.innerHTML=h;
    }).catch(function(){main.innerHTML='<p class="bv-msg">Search couldn’t be loaded just now. Please try again shortly.</p>'});
  }

  /* ---------- people ---------- */
  var SHARDS={};
  function loadPeople(){return PEOPLE?Promise.resolve(PEOPLE):get('people.json').then(function(d){d.byId={};d.people.forEach(function(p){d.byId[p.id]=p});PEOPLE=d;return d})}
  function loadPerson(id){var row=PEOPLE.byId[id];if(!row)return Promise.resolve(null);
    return (SHARDS[row.s]?Promise.resolve(SHARDS[row.s]):get('people/'+row.s+'.json').then(function(d){SHARDS[row.s]=d;return d})).then(function(d){return d[id]||null})}
  function peopleList(){
    crumbsSet([['All issues','shelf'],['People','']]);
    var ps=PEOPLE.people.filter(function(p){return p.n>1}).sort(function(a,b){return b.n-a.n||a.name.localeCompare(b.name)});
    main.innerHTML='<h2 style="margin:0 0 6px">People</h2><p class="bv-msg" style="margin:0 0 18px">'+ps.length+' people named more than once in the digitised issues, most mentioned first. Search finds everyone else.</p><div class="bv-people">'+
      ps.slice(0,600).map(function(p){return '<a href="#'+p.id+'">'+esc(p.name)+'<span>'+p.n+'</span></a>'}).join('')+'</div>';
  }
  function person(id){loadPerson(id).then(function(p){personShow(id,p)})}
  function personShow(id,p){
    if(!p){main.innerHTML='<p class="bv-msg">No one by that name in the digitised issues yet.</p>';return}
    var leg=p.legend?(LEGENDS[id]?Promise.resolve(LEGENDS[id]):get('legends/'+id.slice(2)+'.json').then(function(d){LEGENDS[id]=d;return d})):Promise.resolve(null);
    leg.then(function(L){
      crumbsSet([['All issues','shelf'],['People','people'],[p.name,'']]);
      var photo=(L&&L.photo)||p.photo;
      var h='<div class="bv-person"><header class="bv-person-head'+(photo?' has-photo':'')+'">'+(photo?'<img src="'+MEDIA+esc(photo.file)+'" alt="'+esc(p.name)+'" data-lb="'+MEDIA+esc(photo.file)+'" data-cap="'+esc(photo.caption||'')+'">':'')+
        '<div><span class="label">'+(L?'Belgrave legend':'In The Belgravian')+'</span><h2>'+esc(p.name)+'</h2>'+(L&&L.standfirst?'<p class="stand">'+esc(L.standfirst.replace(/\s*\[\[[A-Za-z0-9-]+\]\]/g,''))+'</p>':'')+
        (L&&L.facts?'<div class="bv-facts">'+L.facts.map(function(f){return '<div>'+esc(f[0])+'<b>'+esc(f[1])+'</b></div>'}).join('')+'</div>':'')+
        (p.slarchive?'<p class="bv-src" style="margin:12px 0 0">Surrey League record: <a href="'+esc(p.slarchive)+'" target="_blank" rel="noopener">slarchive.org</a></p>':'')+'</div></header>';
      if(L&&L.sections){
        h+='<div class="bv-story">'+L.sections.map(function(s){return (s.heading?'<h3>'+esc(s.heading)+'</h3>':'')+s.paras.map(function(t){
          return '<p>'+esc(t).replace(/\s*\[\[([A-Za-z0-9-]+)\]\]/g,function(_,ref){
            if(ref==='slarchive')return p.slarchive?'<sup><a href="'+esc(p.slarchive)+'" target="_blank" rel="noopener" title="Source: slarchive.org">SL</a></sup>':'';
            var n=(L.refs||[]).indexOf(ref)+1;return '<sup><a href="#'+ref+'" title="Source: The Belgravian, item '+ref+'">'+(n||'›')+'</a></sup>'})+'</p>'}).join('')}).join('')+'</div>';
        if(L.photos&&L.photos.length)h+='<section style="display:grid;gap:12px"><h2>Photographs</h2>'+'<div class="bv-figs">'+L.photos.map(function(f){return '<figure class="bv-fig"><img src="'+MEDIA+esc(f.file)+'" alt="'+esc(f.caption||p.name)+'" loading="lazy" data-lb="'+MEDIA+esc(f.file)+'" data-cap="'+esc(f.caption||'')+'"><figcaption>'+esc(f.caption||'')+(f.source?' <a href="#'+esc(f.source)+'">'+esc(f.when||'Source')+'</a>':'')+'</figcaption></figure>'}).join('')+'</div></section>';
        if(L.sources)h+='<p class="bv-src">'+esc(L.sources)+'</p>';
      }
      h+='<section style="display:grid;gap:12px"><h2>Every mention</h2><div class="bv-timeline">'+p.mentions.map(function(m){
        return '<div class="bv-tl"><div class="when">'+esc(m.when)+'</div><div><a href="#'+esc(m.id)+'">'+esc(m.h||m.sum||'Item')+'</a><p>Page '+m.p+(m.note?' · <q>'+esc(m.note)+'</q>':'')+'</p></div></div>'}).join('')+'</div></section>';
      if(p.aka&&p.aka.length>1)h+='<p class="bv-note">Printed as: '+p.aka.map(esc).join(', ')+'.</p>';
      main.innerHTML=h+'</div>';root.scrollIntoView({block:'start'});
    }).catch(function(){main.innerHTML='<p class="bv-msg">That profile couldn’t be loaded just now.</p>'});
  }

  /* ---------- router ---------- */
  function route(){
    var h=(location.hash||'').slice(1),hl=root.dataset.hl||'';root.dataset.hl='';
    var m;
    if(!IDX)return;
    if((m=h.match(/^B(\d+)-p(\d+)$/)))return reader(+m[1],+m[2]);
    if((m=h.match(/^B(\d+)-(\d+)$/))){var no=+m[1];return loadIssue(no).then(function(d){var it=d.items.filter(function(x){return x.id===h})[0];reader(no,it?firstPage(it):1,h,hl)})}
    if((m=h.match(/^B(\d+)$/)))return reader(+m[1],1);
    if(h==='people')return loadPeople().then(peopleList);
    if(/^p-/.test(h))return loadPeople().then(function(){person(h)});
    if(h==='search')return search(q.value);
    shelf();
  }

  root.addEventListener('click',function(e){
    var t;
    if((t=e.target.closest('.bv-region'))){setPane('text');on(t.dataset.id,true);return}
    if((t=e.target.closest('[data-orig]'))){setPane('scan');on(t.dataset.orig,false);var r=main.querySelector('.bv-region[data-id="'+t.dataset.orig+'"]');(r||main.querySelector('.bv-scanpane')).scrollIntoView({block:'center',behavior:'smooth'});return}
    if((t=e.target.closest('.bv-item'))&&!e.target.closest('a,button,img')){on(t.dataset.id,false);return}
    if((t=e.target.closest('[data-page]'))){var cur=(location.hash.match(/^#B(\d+)/)||[])[1];if(cur)go('B'+cur+'-p'+pad(+t.dataset.page));return}
    if((t=e.target.closest('.bv-seg [data-pane]'))){setPane(t.dataset.pane);return}
    if((t=e.target.closest('[data-zoom]'))){var b=main.querySelector('.bv-scanbox');b.classList.toggle('zoom');t.textContent=b.classList.contains('zoom')?'Zoom out':'Zoom in';return}
    if((t=e.target.closest('[data-goitem]'))){go(t.dataset.goitem);return}
    if((t=e.target.closest('[data-search]'))){q.value=t.dataset.search;filter='all';if(location.hash==='#search')search(q.value);else go('search');return}
    if((t=e.target.closest('[data-filter]'))){filter=t.dataset.filter;search(q.value);return}
    if((t=e.target.closest('.bv-hit'))){root.dataset.hl=t.dataset.hl||'';return}
    if((t=e.target.closest('img[data-lb]'))){lightbox(t.dataset.lb,t.dataset.cap);return}
  });
  main.addEventListener('mouseover',function(e){var t=e.target.closest('.bv-item');if(t&&window.matchMedia('(min-width:861px)').matches){main.querySelectorAll('.bv-region').forEach(function(r){r.classList.toggle('on',r.dataset.id===t.dataset.id)})}});
  root.querySelector('.bv-search').addEventListener('submit',function(e){e.preventDefault();filter='all';if(location.hash==='#search')search(q.value);else go('search')});
  function lightbox(src,cap){
    var d=document.createElement('div');d.className='bv-lb bv';d.setAttribute('role','dialog');d.setAttribute('aria-label','Photograph');
    d.innerHTML='<figure><img src="'+esc(src)+'" alt="'+esc(cap||'')+'">'+(cap?'<figcaption>'+esc(cap)+'</figcaption>':'')+'</figure><button type="button">Close</button>';
    function close(){d.remove();document.removeEventListener('keydown',k)}function k(e){if(e.key==='Escape')close()}
    d.addEventListener('click',function(e){if(e.target===d||e.target.tagName==='BUTTON')close()});document.addEventListener('keydown',k);document.body.appendChild(d);d.querySelector('button').focus();
  }
  window.addEventListener('hashchange',route);
  Promise.all([get('index.json'),get('people.json').then(function(d){d.byId={};d.people.forEach(function(p){d.byId[p.id]=p});PEOPLE=d}).catch(function(){})])
    .then(function(r){IDX=r[0];route()})
    .catch(function(){main.innerHTML='<p class="bv-msg">The archive couldn’t be loaded just now. Please try again shortly.</p>'});
})();
</script>
</body></html>

<!-- 2. Short dates ("15 Oct 2026") on articles and news cards -->
<script>
(function(){
  function shorten(){
    document.querySelectorAll('time.Blog-meta-item--date, time.summary-metadata-item--date, .summary-metadata-item--date time').forEach(function(t){
      if(t.dataset.bhShort)return;
      var d=new Date(t.getAttribute('datetime')||t.textContent);
      if(isNaN(d))return;
      t.textContent=d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}).replace('Sept','Sep');
      t.dataset.bhShort='1';
    });
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',shorten);else shorten();
  window.addEventListener('load',shorten);
})();
</script>
<!-- 4. Left and right arrow keys move between news articles (Left: newer, Right: older) -->
<script>
(function(){
  document.addEventListener('keydown',function(e){
    if(e.defaultPrevented||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey)return;
    if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
    if(document.querySelector('.bh-lb.is-open'))return;
    var el=document.activeElement;
    if(el&&(el.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)))return;
    var link=document.querySelector(e.key==='ArrowLeft'?'.BlogItem-pagination-link--prev':'.BlogItem-pagination-link--next');
    if(link&&link.href){e.preventDefault();window.location.href=link.href;}
  });
})();
</script>
<!-- 3. Photos in news articles open full-screen on click or tap -->
<style>
.bh-lb{position:fixed;inset:0;z-index:100000;background:rgba(30,26,26,.97);display:none;align-items:center;justify-content:center;flex-direction:column;font-family:"Public Sans",sans-serif;-webkit-font-smoothing:antialiased}

.bh-lb-count{position:absolute;top:22px;left:24px;color:#fff;font-size:12px;font-weight:600;letter-spacing:.08em}

.bh-lb-prev{left:10px}.bh-lb-next{right:10px}

@media (max-width:640px){.bh-lb-prev,.bh-lb-next{display:none}.bh-lb img{max-width:100vw;max-height:78vh}}
</style>
<script>
(function(){
  function fullSrc(img){
    var u=img.getAttribute('data-image')||img.getAttribute('data-src')||img.currentSrc||img.src||'';
    if(!u)return '';
    u=u.split('?')[0];
    return /squarespace-cdn|squarespace\.com/.test(u)?u+'?format=2500w':u;
  }
  function captionFor(img){
    var fig=img.closest('figure, .sqs-block-image, .slide, .sqs-gallery-design-grid-slide');
    var c=fig&&fig.querySelector('.image-caption, figcaption, .meta-description, .image-caption-wrapper');
    var t=c?c.textContent.trim():'';
    if(!t)t=img.getAttribute('alt')||'';
    return /\.(jpe?g|png|webp|heic)$/i.test(t)?'':t;
  }
  function init(){
    var article=document.querySelector('.BlogItem');
    if(!article)return;
    var imgs=[].slice.call(article.querySelectorAll('.sqs-block-image img, .sqs-block-gallery img, .sqs-html-content img')).filter(function(img){
      var a=img.closest('a');
      return !(a&&a.getAttribute('href')&&a.getAttribute('href').charAt(0)!=='#');
    });
    if(!imgs.length)return;
    var box=document.createElement('div');
    box.className='bh-lb';box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');box.setAttribute('aria-label','Photo viewer');
    box.innerHTML='<span class="bh-lb-count"></span><button class="bh-lb-close" aria-label="Close photo">&times;</button><button class="bh-lb-prev" aria-label="Previous photo">&#8249;</button><img alt=""><p class="bh-lb-cap"></p><button class="bh-lb-next" aria-label="Next photo">&#8250;</button>';
    document.body.appendChild(box);
    var big=box.querySelector('img'),cap=box.querySelector('.bh-lb-cap'),count=box.querySelector('.bh-lb-count'),
        prev=box.querySelector('.bh-lb-prev'),next=box.querySelector('.bh-lb-next'),close=box.querySelector('.bh-lb-close'),
        i=0,lastFocus=null,multi=imgs.length>1;
    if(!multi){prev.style.display='none';next.style.display='none';count.style.display='none';}
    function show(n){
      i=(n+imgs.length)%imgs.length;
      var img=imgs[i];
      big.src=fullSrc(img);big.alt=img.getAttribute('alt')||'';
      cap.textContent=captionFor(img);
      count.textContent=(i+1)+' / '+imgs.length;
    }
    function open(el){imgs=imgs.filter(function(x){return x.isConnected});lastFocus=document.activeElement;show(Math.max(0,imgs.indexOf(el)));box.classList.add('is-open');document.documentElement.style.overflow='hidden';close.focus();}
    function shut(){box.classList.remove('is-open');big.removeAttribute('src');document.documentElement.style.overflow='';if(lastFocus&&lastFocus.focus)lastFocus.focus();}
    imgs.forEach(function(img,n){
      img.classList.add('bh-lb-target');
      img.setAttribute('tabindex','0');img.setAttribute('role','button');
      if(!img.getAttribute('aria-label'))img.setAttribute('aria-label','Open photo full screen');
      img.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();open(img);},true);
      img.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open(img);}});
    });
    close.addEventListener('click',shut);
    prev.addEventListener('click',function(e){e.stopPropagation();show(i-1);});
    next.addEventListener('click',function(e){e.stopPropagation();show(i+1);});
    box.addEventListener('click',function(e){if(e.target===box)shut();});
    document.addEventListener('keydown',function(e){
      if(!box.classList.contains('is-open'))return;
      if(e.key==='Escape')shut();
      else if(e.key==='ArrowLeft'&&multi)show(i-1);
      else if(e.key==='ArrowRight'&&multi)show(i+1);
      else if(e.key==='Tab'){var f=[close,prev,next].filter(function(b){return b.offsetParent!==null;});var k=f.indexOf(document.activeElement);e.preventDefault();f[(k+(e.shiftKey?-1:1)+f.length)%f.length].focus();}
    });
    var x0=null;
    box.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;},{passive:true});
    box.addEventListener('touchend',function(e){if(x0===null||!multi)return;var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)show(dx<0?i+1:i-1);x0=null;});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
.bh-res{--ink:#1e1a1a;--body:#4a4343;--slate:#5c5555;--claret:#7a001d;--gold:#d6b97a;--rule:#e6dfd3;--cream:#f5efe4;

.bh-res td.wrap{white-space:normal;min-width:140px}
.bh-res thead th{font:600 12px/16px "Public Sans",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);vertical-align:bottom;white-space:normal;min-width:2.5em}
.bh-res thead tr:last-child th{border-bottom:3px solid var(--gold);border-image:linear-gradient(135deg,#e7d8b0 0%,#d6b97a 28%,#d5b271 54%,#d09d55 93%,#ce954a 100%) 1}
.bh-res .num{font-family:"IBM Plex Mono",ui-monospace,monospace;text-align:right}
.bh-res thead th.num{font-family:"Public Sans",sans-serif}
.bh-res tr>:first-child{padding-left:0;position:sticky;left:0;background:#fff;z-index:1}
.bh-res tr>:last-child{padding-right:0}
.bh-res tr.us td{background:var(--cream);font-weight:600}
.bh-res tbody tr:hover td{background:#f3ede2}

.bh-res td a{color:var(--claret);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.bh-res .bh-more{margin:12px 0 0;background:none;border:0;padding:0;cursor:pointer;font:500 15px/20px "Public Sans",sans-serif;color:var(--claret);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.bh-res .bh-more:hover{text-decoration-thickness:2px}
.bh-res .bh-src{margin:10px 0 0;font:400 13px/18px "Public Sans",sans-serif;color:var(--slate)}

.sqs-html-content>.bh-res{padding-left:0;padding-right:0} /* tables placed under a link sit inside a text block, which is already padded */
@media (max-width:640px){.bh-res th,.bh-res td{padding:6px 8px;font-size:13px}}
</style>
<script>
(function(){
  var DATA='https://stephengardner1.github.io/belgrave-harriers-data/results/'; // one small file per article
  var SHOW=25;
  var article=document.querySelector('.BlogItem');
  if(!article)return;
  var frames=[].slice.call(article.querySelectorAll('iframe[src*="docs.google.com/spreadsheets"]'));
  // links to results on other sites: a saved copy of the official results is shown under the link,
  // so the article doesn't depend on that site staying up; the link goes to the official page
  var links=[].slice.call(article.querySelectorAll('a[href^="http"]'));
  if(!frames.length&&!links.length)return;
  var slug=location.pathname.replace(/\/$/,'').split('/').pop();

  function keyOf(src){
    var m=src.match(/\/d\/(?:e\/)?([^/]+)\//);if(!m)return null;
    var g=src.match(/gid=(\d+)/);
    return m[1]+'|'+(/single=true/.test(src)&&g?g[1]:'all');
  }
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function cell(c){return typeof c==='string'?{t:c,c:1,r:1,h:null}:{t:c[0],c:c[1],r:c[2],h:c[3]}}
  var NUM=/^[\s\d:.,\-+%()=\/]+$/;

  function table(tab,showAll){
    var rows=tab.rows||[],head=tab.head||0;
    if(!head&&rows.length>1){ // no frozen header: treat row 1 as headings only if it is all words
      var r0=rows[0].map(cell);
      var words=r0.filter(function(c){return c.t}).length;
      if(r0.length>1&&words>=r0.length/2&&r0.every(function(c){return !c.t||!NUM.test(c.t)})&&!rows[1].map(cell).every(function(c){return !c.t||!NUM.test(c.t)}))head=1;
    }
    var body=rows.slice(head);
    // numeric columns: mostly figures in the body
    var cols=Math.max.apply(null,rows.map(function(r){return r.reduce(function(n,c){return n+cell(c).c},0)}).concat([1]));
    var isNum=[];for(var k=0;k<cols;k++){var n=0,t=0;
      body.forEach(function(r){var x=0;r.forEach(function(c){c=cell(c);if(x===k&&c.t){t++;if(NUM.test(c.t))n++}x+=c.c})});
      isNum[k]=t>0&&n/t>.7}
    function ours(r){return r.some(function(c){var t=cell(c).t.trim();return /belgrave/i.test(t)||/^BEL( [A-D])?$/.test(t)})}
    var mark=body.filter(function(r){return r.length&&ours(r)}).length<=body.filter(function(r){return r.length}).length/2;
    function tr(r,tag){
      if(!r.length)return '<tr class="gap"><td colspan="'+cols+'"></td></tr>';
      var h='<tr'+(tag==='td'&&mark&&ours(r)?' class="us"':'')+'>',x=0;
      r.forEach(function(c){c=cell(c);
        var cls=[];if(isNum[x]&&tag==='td')cls.push('num');if(isNum[x]&&tag==='th')cls.push('num');
        if(tag==='td'&&c.t.length>40)cls.push('wrap');
        var txt=esc(c.t).replace(/\n/g,'<br>');
        if(c.h&&/^https?:/.test(c.h))txt='<a href="'+esc(c.h)+'" target="_blank" rel="noopener">'+txt+'</a>';
        h+='<'+tag+(cls.length?' class="'+cls.join(' ')+'"':'')+(c.c>1?' colspan="'+c.c+'"':'')+(c.r>1?' rowspan="'+c.r+'"':'')+'>'+txt+'</'+tag+'>';
        x+=c.c});
      return h+'</tr>'}
    var shown=showAll?body:body.slice(0,SHOW);
    var h='<div class="bh-scroll"><table>';
    if(head)h+='<thead>'+rows.slice(0,head).map(function(r){return tr(r,'th')}).join('')+'</thead>';
    h+='<tbody>'+shown.map(function(r){return tr(r,'td')}).join('')+'</tbody></table></div>';
    var real=body.filter(function(r){return r.length}).length;
    if(!showAll&&body.length>SHOW)h+='<button type="button" class="bh-more">Show all '+real.toLocaleString('en-GB')+' rows</button>';
    return h}

  function render(box,embed){
    var tabs=embed.tabs.filter(function(t){return t.rows});
    if(!tabs.length){
      if(embed.tabs.some(function(t){return t.missing})){ // sheet deleted before it could be saved
        var note=document.createElement('p');note.className='sqs-block bh-res-gone';
        note.textContent='The results table for this article is no longer available.';
        box.parentNode.insertBefore(note,box);box.style.display='none';return true}
      return false}
    var cur=0,all={};
    var wrap=document.createElement('div');wrap.className='sqs-block bh-res';
    function draw(){
      var h='';
      if(tabs.length>1){h+='<div class="bh-seg" role="tablist" aria-label="Results tables">';
        tabs.forEach(function(t,i){h+='<button type="button" role="tab" data-i="'+i+'" aria-selected="'+(i===cur)+'">'+esc(t.name||('Table '+(i+1)))+'</button>'});
        h+='</div>'}
      h+='<div role="tabpanel">'+table(tabs[cur],all[cur])+'</div>';
      wrap.innerHTML=h}
    wrap.addEventListener('click',function(e){
      var b=e.target.closest('button');if(!b)return;
      if(b.dataset.i!=null){cur=+b.dataset.i;draw();fit(wrap);var s=wrap.querySelector('[aria-selected="true"]');s&&s.focus()}
      else if(b.classList.contains('bh-more')){all[cur]=true;draw();fit(wrap)}
    });
    draw();
    box.parentNode.insertBefore(wrap,box);
    box.style.display='none';
    fits.push(wrap);fit(wrap);
    return true}

  // Wide tables may run past the text column, as far as the page's content edge
  var fits=[];
  function edge(){
    var ref=document.querySelector('.BlogItem-pagination')||document.querySelector('.Main-content');
    var r=ref.getBoundingClientRect(),cs=getComputedStyle(ref);
    return ref.classList.contains('Main-content')?r.right-parseFloat(cs.paddingRight):r.right}
  function fit(w){
    var sc=w.querySelector('.bh-scroll'),tb=sc&&sc.querySelector('table');if(!tb)return;
    sc.style.width='';
    var col=sc.getBoundingClientRect().width,avail=edge()-sc.getBoundingClientRect().left;
    var need=tb.scrollWidth;
    if(need>col+1&&avail>col)sc.style.width=Math.min(need,avail)+'px'}
  var t;window.addEventListener('resize',function(){clearTimeout(t);t=setTimeout(function(){fits.forEach(fit)},150)});

  fetch(DATA+encodeURIComponent(slug)+'.json').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
    var mine=d.embeds.filter(function(e){return e.article===slug});
    frames.forEach(function(f,i){
      var k=keyOf(f.getAttribute('src')||'');
      var e=mine.filter(function(x){return x.key===k})[0]||mine.filter(function(x){return x.embedIndex===i})[0];
      if(!e)return;
      var box=f.closest('.sqs-block')||f;
      render(box,e);
    });
    mine.filter(function(x){return x.link}).forEach(function(e){
      var same=links.filter(function(x){return x.getAttribute('href')===e.link}),a=same[0];if(!a)return;
      function point(){if(e.linkNow)same.forEach(function(x){x.href=e.linkNow})}
      if(!e.tabs||!e.tabs.length){point();return} // a saved copy of the results file: just point the link at it
      var at=a.closest('p')||a,spot=document.createElement('span');
      at.parentNode.insertBefore(spot,at.nextSibling);
      if(!render(spot,e))return;
      point();
      if(e.credit){var c=document.createElement('p');c.textContent=e.credit;
        c.style.cssText='font:400 13px/18px "Public Sans",sans-serif;color:#5c5555;margin:-16px 0 28px';
        spot.parentNode.insertBefore(c,spot)}
    });
  }).catch(function(){/* leave the original embeds in place */});
})();
</script>
<!-- 7. Bylines and credit lines on news articles (23 Oct 2026)
     Display only: nothing in the articles themselves is changed.
     a) "Administrator" and "Guest User" are not people. Where the article names its writer for the
        whole piece, that name is shown instead; otherwise the byline is left out.
     b) Standalone credit lines ("Words by…", "Photos by…", "Photo: …") get one quiet style,
        wherever the author put them. Same words, same place. -->
<style>
.Main-content .sqs-html-content p.bh-credit,
.Main-content .sqs-html-content p.bh-credit *{
  font-size:14px !important;line-height:1.5 !important;color:#5c5555 !important;
  font-style:normal !important;font-weight:400 !important}
</style>
<script>
(function(){
  var article=document.querySelector('.BlogItem');
  if(!article)return;

  // a) generic bylines
  var WRITER={ // articles whose own text credits one writer for the whole piece
    'belgrave-hosts-club-throwing-champs-and-invitational-match':'Chris Privett',
    'ukwal-match-3-report-lee-valley':'Jojo Rhodes',
    'uk-womens-league-match-1-report':'Jojo Rhodes',
    'uk-womens-league-match-1-wigan-7th-may':'Josephine Rhodes',
    'surrey-county-10000m-silver-nick-buckle':'Charlie Dickinson',
    'rosenheim-final-report':'Adam Cameron',
    'belgrave-harriers-womens-road-and-country-season-review-2013-14':'Will Cockerell'
  };
  var GENERIC=/^(administrator|guest user)$/i;
  var slug=location.pathname.replace(/\/$/,'').split('/').pop();
  article.querySelectorAll('.BlogItem-meta .Blog-meta-item--author').forEach(function(a){
    if(!GENERIC.test(a.textContent.trim()))return;
    var name=WRITER[slug];
    if(name){var s=document.createElement('span');s.className=a.className;s.textContent=name;a.parentNode.replaceChild(s,a)}
    else a.parentNode.removeChild(a);
  });

  // b) credit lines
  var CREDIT=/^(?:(?:words|report|written|text|article|photos?|pictures?|photography|images?|video)(?:\s+and\s+(?:words|photos?|pictures?))?\s*(?:by|:|credit:?)\s*[^.]{2,60}?(?:\.|$)\s*)+$/i;
  article.querySelectorAll('.sqs-html-content p').forEach(function(p){
    var t=p.textContent.replace(/\s+/g,' ').trim();
    if(!(t&&t.length<=140&&CREDIT.test(t)))return;
    p.classList.add('bh-credit');
    [p].concat([].slice.call(p.querySelectorAll('*'))).forEach(function(el){ // beats the standfirst style if a credit comes first
      el.style.setProperty('font-size','14px','important');el.style.setProperty('line-height','1.5','important');
      el.style.setProperty('color','#5c5555','important');el.style.setProperty('font-style','normal','important');
      el.style.setProperty('font-weight','400','important')});
  });
})();
</script>
<!-- 8. Subheadings typed as bold lines (23 Oct 2026)
     Display only. A short paragraph that is entirely bold and works as a section label
     ("RESULTS:", "A TEAM", "Individual times", "Battersea Park, 25 April 2001") is shown as a
     proper subheading. All-capitals labels are shown in sentence case, keeping abbreviations and
     names; a trailing colon, full stop or semicolon is not shown. No words are changed.
     Left alone: names, table fragments, questions, notices, credits and lines that introduce a quote or list. -->
<script>
(function(){
  var article=document.querySelector('.BlogItem');
  if(!article)return;
  var LABEL=/^(results?|team results?|teams?|individuals?|individual (results|times|legs)|men|women|address|international|international championships|british championships|historical note|match summary|overall( after .*)?|([‘'’]?[a-d][‘'’]?[ -](team|string))|belgrave [‘'’]?[a-d][‘'’]?)$/i;
  var NOTICE=/\b(sold out|postage|collection only|tickets?|please|writes|author|to follow|reports|by)\b/i;
  var TABLEY=/^(pos|pts|points|name|time|club|bel|no\.?|#)$/i;
  var CREDIT=/^(?:words|report|written|text|article|author|photos?|pictures?|photography|images?|video)(?:\s+and\s+(?:words|photos?|pictures?))?\s*(?:by|:|credit:?)/i;
  // kept in capitals when a capitals label is put into sentence case
  var KEEP=/^(SEAA|ERRA|NAL|XC|GB|UK|AAA|BAL|BMAF|UKWAL|EA|ECCC|SL|PB|SB|IAAF|SEAA|NCAA|[UVMW]\d+|\d+\w*)$/;
  var NAMES={crystal:'Crystal',palace:'Palace',sophie:'Sophie',belgrave:'Belgrave',belles:'Belles',bels:'Bels',
    surrey:'Surrey',london:'London',southern:'Southern',national:'National',aldershot:'Aldershot',
    battersea:'Battersea',tooting:'Tooting',bec:'Bec',wimbledon:'Wimbledon',harriers:'Harriers'};

  function promote(t){
    var s=t.replace(/\s*[:.;]+$/,'').trim();
    if(!s||s.indexOf('?')>-1||NOTICE.test(s))return false;
    var w=s.split(/\s+/),letters=s.replace(/[^A-Za-z]/g,''),caps=letters.length>=3&&letters===letters.toUpperCase();
    if(LABEL.test(s))return true;
    if(/[:;]\s*-?$/.test(t))return false;
    if(/\d:\d\d/.test(s)||/^\d+\s/.test(s))return false;
    if(/^(bel|race|buffet|useful|new athletes)\b/i.test(s))return false;
    if(w.length===1||TABLEY.test(s))return false;
    if(caps)return w.length<=5;

  var first;
  function sentenceCase(s){
    return s.replace(/[A-Za-z][A-Za-z0-9’']*/g,function(word){
      var out;
      if(KEEP.test(word))out=word;
      else if(NAMES[word.toLowerCase()])out=NAMES[word.toLowerCase()];
      else out=first?word.charAt(0)+word.slice(1).toLowerCase():word.toLowerCase();
      first=false;return out});
  }

  article.querySelectorAll('.sqs-html-content p').forEach(function(p){
    var t=p.textContent.replace(/\s+/g,' ').trim();
    if(!t||t.length>60||p.querySelector('a,img')||CREDIT.test(t))return;
    var bold=[].slice.call(p.querySelectorAll('strong,b')).map(function(b){return b.textContent}).join(' ').replace(/\s+/g,' ').trim();
    if(bold!==t||!promote(t))return;
    var letters=t.replace(/[^A-Za-z]/g,''),caps=letters.length>=3&&letters===letters.toUpperCase();

    while(p.firstChild)h.appendChild(p.firstChild);

        if(KEEP.test(w))return w;
        if(NAMES[w.toLowerCase()])return NAMES[w.toLowerCase()];
        return i===0&&x===nodes[0]?w.charAt(0)+w.slice(1).toLowerCase():w.toLowerCase()})});
    for(var i=nodes.length-1;i>=0;i--){
      if(!nodes[i].nodeValue.trim())continue;
      nodes[i].nodeValue=nodes[i].nodeValue.replace(/\s*[:.;]+\s*$/,'');break}

<!-- 10. Hero photo on news articles (23 Oct 2026)

     Framing: eyes found by face detection sit on the top-third line; with no faces, the author's focal

     Tapping opens the whole, uncropped photo. -->
<style>

</style>
<script>
(function(){
  var article=document.querySelector('.BlogItem');
  if(!article)return;
  var layout=article.querySelector('.sqs-layout');
  if(!layout)return;
  var first=layout.querySelector('.sqs-block');                 // already opens with a photo
  if(first&&/sqs-block-(image|gallery)/.test(first.className))return;
  var meta=document.querySelector('meta[property="og:image"]');
  var src=meta&&meta.getAttribute('content')||'';
  src=src.replace(/^http:/,'https:').split('?')[0];
  // a real featured photo is stored with the news posts and has a filename
  if(src.indexOf('/5deec20d5aff607e8c14cbf2/')<0||/\/$/.test(src)){
    // older articles whose featured image is a blank placeholder: use the first photo in the article,
    // if it is big enough to be shown wide
    src='';
    var p=layout.querySelector('.sqs-block-image img, .sqs-block-gallery img, .sqs-html-content img');
    if(p){
      var dim=(p.getAttribute('data-image-dimensions')||'').split('x');
      var u=(p.getAttribute('data-image')||p.getAttribute('data-src')||p.src||'').split('?')[0].replace(/^http:/,'https:');
      // size known on the page: use it; not known (older inline photos): show it, then confirm
      // against the framing data and withdraw it if the photo is too small to be shown wide
      if(u&&!/\/$/.test(u)&&(!dim[0]||+dim[0]>=700)){src=u;var check=!dim[0]}
    }
    if(!src)return;
  }
  var slug=location.pathname.replace(/\/$/,'').split('/').pop();
  var title=article.querySelector('.BlogItem-title');
  var box=document.createElement('figure');
  box.className='bh-hero sqs-block-image';
  var img=document.createElement('img');
  img.src=src+'?format=1500w';
  img.setAttribute('data-image',src);
  img.alt=title?title.textContent.trim():'';
  img.decoding='async';
  box.appendChild(img);
  if(check)box.style.display='none';        // shown once confirmed, so nothing jumps if withdrawn
  layout.parentNode.insertBefore(box,layout);

  var spec=null; // {e:[x,y]} eyeline, or {c:[x,y]} centre point
  function frame(){
    var w=img.naturalWidth,h=img.naturalHeight;if(!w||!h)return;
    var p=spec&&(spec.e||spec.c),eyes=!spec||!!spec.e;
    var fx=p?p[0]:0.5, fy=p?p[1]:(h>w?0.30:0.40);              // no data yet: where eyes usually sit
    var H=h/w,Hc=2/3,Wc=(w/h)/1.5,py=50,px=50,target=eyes?Hc/3:Hc/2;
    if(H>Hc)py=Math.max(0,Math.min(1,(fy*H-target)/(H-Hc)))*100;
    if(Wc>1)px=Math.max(0,Math.min(1,(fx*Wc-0.5)/(Wc-1)))*100;
    img.style.objectPosition=px.toFixed(1)+'% '+py.toFixed(1)+'%';
  }
  img.addEventListener('load',frame);
  fetch('https://stephengardner1.github.io/belgrave-harriers-data/hero-framing.json')
    .then(function(r){return r.json()})
    .then(function(d){spec=(d.items||{})[slug]||null;
      if(check&&(!spec||spec.small||!spec.u)){box.parentNode&&box.parentNode.removeChild(box);return}
      if(check)box.style.display='';
      frame()})
    .catch(function(){if(check&&box.parentNode)box.parentNode.removeChild(box)});
})();
</script>

  function place(img,spec,w,h){ // eyeline on the top third of a 16:9 frame, or the point centred

<!-- 12. Slideshow captions (23 Oct 2026)

<style>

.bh-gcap{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:12px 0 0;padding:0;
  font:400 14px/20px "Public Sans",system-ui,sans-serif;color:#5c5555;text-align:left;-webkit-font-smoothing:antialiased}

<script>
(function(){
  function build(container){
    if(container.dataset.bhCap)return;
    var slides=[].slice.call(container.querySelectorAll('.sqs-gallery > .slide'));
    if(!slides.length)return;
    var items=slides.map(function(s){
      var t=s.querySelector('.meta-title'),d=s.querySelector('.meta-description');
      var title=t?t.innerHTML.trim():'',html=d?d.innerHTML.trim():'';
      if(!title&&!d)return null;
      // the credit goes on its own line: everything from the last "Photo:" or "Photos:"
      var tmp=document.createElement('div');tmp.innerHTML=html;
      var text=tmp.textContent,credit='',body=html;
      var m=html.lastIndexOf('Photo');
      if(m>-1&&/^Photos?\b/.test(html.slice(m))&&text.trim().indexOf('Photo')>0){
        body=html.slice(0,m).replace(/(\s|&nbsp;)+$/,'');credit=html.slice(m);
        // close any paragraph left open on the caption side, open one on the credit side
        if(/<p[^>]*>(?![\s\S]*<\/p>)/i.test(body))body+='</p>';
        if(/<\/p>/i.test(credit)&&!/<p[\s>]/i.test(credit))credit='<p>'+credit;
      }
      return {title:title,body:body,credit:credit};
    });
    if(!items.some(Boolean))return;
    container.dataset.bhCap='1';
    var cap=document.createElement('figcaption');cap.className='bh-gcap';cap.setAttribute('aria-live','polite');
    container.parentNode.insertBefore(cap,container.nextSibling);
    var last=-1;
    function render(i){
      var it=items[i]||{title:'',body:'',credit:''};
      var h='<span class="bh-gcap-main">';
      if(it.title||it.body)h+='<span class="bh-gcap-text">'+(it.title?'<strong>'+it.title+'</strong> ':'')+it.body.replace(/^<p[^>]*>|<\/p>$/gi,'')+'</span>';
      if(it.credit)h+=(it.title||it.body?'<br>':'')+'<span class="bh-gcap-credit">'+it.credit.replace(/^<p[^>]*>|<\/p>$/gi,'')+'</span>';
      h+='</span>';
      if(slides.length>1)h+='<span class="bh-gcap-count">'+(i+1)+' of '+slides.length+'</span>';
      cap.innerHTML=h;
    }
    function show(){
      var i=slides.findIndex(function(s){return s.classList.contains('sqs-active-slide')});
      if(i<0)i=0;if(i===last)return;last=i;render(i);
    }
    // keep the space for the longest caption, so the page doesn't jump between photos
    function fit(){
      cap.style.minHeight='';var max=0;
      for(var k=0;k<slides.length;k++){render(k);max=Math.max(max,cap.offsetHeight)}
      cap.style.minHeight=max+'px';last=-1;show();
    }

    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
    var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(fit,150)});
    new MutationObserver(show).observe(container.querySelector('.sqs-gallery'),{subtree:true,attributes:true,attributeFilter:['class']});
  }
  function init(){document.querySelectorAll('.sqs-gallery-block-slideshow').forEach(build)}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
  window.addEventListener('load',init);
})();
</script>

<script>

<script>

        var img=(it.assetUrl||'');if(!/\/[^\/]+\.[a-z]{3,4}$/i.test(img.split('?')[0]))img='';

      }).catch(function(){return null});
    })).then(function(cards){
      cards=cards.filter(Boolean);if(!cards.length)return;
      var box=document.createElement('aside');box.className='bh-rel';box.setAttribute('aria-label',rel.heading||'Related articles');
      box.innerHTML='<p class="bh-rel-head">'+esc(rel.heading||'Related articles')+'</p><div class="bh-rel-cards">'+cards.map(function(c){
        return '<a class="bh-rel-card" href="'+esc(c.href)+'">'+(c.img?'<span class="bh-rel-img"><img src="'+esc(c.img)+'?format=500w" alt="" loading="lazy" data-slug="'+esc(c.slug)+'"></span>':'')+
          '<span class="bh-rel-date">'+c.date.getDate()+' '+MON[c.date.getMonth()]+' '+c.date.getFullYear()+'</span><span class="bh-rel-title">'+esc(c.title)+'</span></a>'}).join('')+'</div>';
      // frame each photo with the eyes on the top third, as the hero photos are
      fetch(BASE+'hero-framing.json').then(function(r){return r.json()}).then(function(d){
        [].slice.call(box.querySelectorAll('img[data-slug]')).forEach(function(img){
          var spec=(d.items||{})[img.getAttribute('data-slug')];if(!spec||!(spec.e||spec.c))return;
          function frame(){var w=img.naturalWidth,h=img.naturalHeight;if(!w||!h)return;
            var p=spec.e||spec.c,eyes=!!spec.e,H=h/w,Hc=2/3,Wc=(w/h)/1.5,py=50,px=50,target=eyes?Hc/3:Hc/2;

        box.classList.remove('side','below');box.style.cssText='';
        var lr=layout.getBoundingClientRect(),ar=article.getBoundingClientRect();
        var ref=document.querySelector('.BlogItem-pagination')||document.querySelector('.Main-content');
        var edge=ref.getBoundingClientRect().right,gap=40,w=Math.min(260,edge-lr.right-gap);
        if(w>=200){
          if(box.parentNode!==article)article.appendChild(box);
          if(getComputedStyle(article).position==='static')article.style.position='relative';
          box.classList.add('side');box.style.width=w+'px';
          box.style.left=(lr.right+gap-ar.left)+'px';box.style.top=(lr.top-ar.top)+'px';
          // stay clear of wide results tables that run into the margin
          var b=box.getBoundingClientRect(),clash=[].slice.call(article.querySelectorAll('.bh-scroll')).some(function(s){

      }
      place();
      var t;window.addEventListener('resize',function(){clearTimeout(t);t=setTimeout(place,200)});

    });
  }).catch(function(){});
})();

<!-- 16. Surrey League results, compendium style (23 Oct 2026)

<style>

<script>
(function(){
  var article=document.querySelector('.BlogItem');if(!article)return;
  var layout=article.querySelector('.sqs-layout');if(!layout)return;
  var slug=location.pathname.replace(/\/$/,'').split('/').pop();
  var DATA='https://stephengardner1.github.io/belgrave-harriers-data/slarchive/';
  var SHOW=50; // finishers shown before "Show all"
  var n=0;
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function slugName(nm){return nm.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'')}
  fetch(DATA+encodeURIComponent(slug)+'.json').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(file){
    if(!document.querySelector('link[href*="IBM+Plex+Mono"]')){var f=document.createElement('link');f.rel='stylesheet';
      f.href='https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap';document.head.appendChild(f)}
    var clubs=file.clubs||{};
    var blocks=file.blocks||[{races:[file]}];
    blocks.forEach(function(bl){
      var box=document.createElement('section');box.className='bh-sl';box.setAttribute('aria-label','Results');
      var races=bl.races||[],cur=0,inner=document.createElement('div');
      if(races.length>1){
        var sw=document.createElement('div');sw.className='bh-sl-sex';sw.setAttribute('role','group');sw.setAttribute('aria-label','Race');
        sw.innerHTML=races.map(function(r,i){return '<button type="button" aria-pressed="'+(i===0)+'">'+esc(r.sex||('Race '+(i+1)))+'</button>'}).join('');
        [].slice.call(sw.children).forEach(function(b,i){b.addEventListener('click',function(){
          [].slice.call(sw.children).forEach(function(x,j){x.setAttribute('aria-pressed',j===i)});cur=i;draw(inner,races[i],clubs)})});
        box.appendChild(sw);
      }
      box.appendChild(inner);draw(inner,races[0],clubs);
      // where it goes: under the article's own link to these results, or at the end of the article
      var at=null,after=[].concat(bl.after||[]);
      if(after.length){var a=[].slice.call(article.querySelectorAll('a[href]')).filter(function(x){
        return after.indexOf(x.getAttribute('href'))>=0||after.indexOf(x.href)>=0})[0];if(a)at=a.closest('p,h1,h2,h3,h4,li')||a}
      if(!at&&bl.afterText){var norm=function(t){return t.replace(/\s+/g,' ').trim().toLowerCase()},want=norm(bl.afterText);
        at=[].slice.call(article.querySelectorAll('.sqs-html-content p,.sqs-html-content h2,.sqs-html-content h3,.sqs-html-content h4,.sqs-html-content li')).filter(function(x){return norm(x.textContent).indexOf(want)===0})[0]||null}
      if(at){at.parentNode.insertBefore(box,at.nextSibling);
        // a text column is narrower than the article: let the results use the full width
        var fit=function(){box.style.width='';box.style.maxWidth='';var lw=layout.getBoundingClientRect().width,bw=box.getBoundingClientRect().width;
          if(lw-bw>40){box.style.width=Math.min(850,lw)+'px';box.style.maxWidth='none'}};
        fit();var t;window.addEventListener('resize',function(){clearTimeout(t);t=setTimeout(fit,150)});
      } else layout.parentNode.insertBefore(box,layout.nextSibling);
    });
  }).catch(function(){});

  function draw(root,d,clubs){
    clubs=Object.assign({},clubs,d.clubs||{});
    function vest(c,size){var s=(d.vests||{})[c]||(d.vests||{})[''];if(!s)return'';n++;
      return s.replace('<svg','<svg class="bh-sl-vest" width="'+size+'" height="'+size+'" aria-hidden="true"').replace(/VID/g,'bhv'+n)}
    function marks(ms){return (ms||[]).map(function(m){
      var t=m.t,ti=m.title?' title="'+esc(m.title)+'" aria-label="'+esc(m.title)+'"':'';
      if(t.charAt(0)==='(')return '<span class="tag">'+esc(t)+'</span>';
      var k=t==='▲'?'up':t==='▼'?'down':t==='='?'same':t==='✦'?'new':'emo';
      return '<span class="mk '+k+'"'+ti+'>'+esc(t)+'</span>'}).join('')}
    function indRow(r,i){
      var name=r.name==='Unknown'?'<span style="color:var(--g5)">Unknown</span>':'<a href="'+(d.athleteBase||'https://slarchive.org/athlete/')+slugName(r.ath||r.name)+'">'+esc(r.name)+'</a>';
      return '<tr data-club="'+esc(r.club)+'"'+(i>=SHOW?' hidden':'')+'><td class="c-pos num">'+esc(r.pos)+'</td><td class="c-pts num">'+esc(r.pts)+'</td>'+
        '<td class="c-club">'+(r.club?'<button type="button" class="pick" data-pick="'+esc(r.club)+'" title="Show only '+esc(clubs[r.club]||r.club)+'">'+vest(r.club,14)+'<span>'+esc(r.club)+'</span></button>':vest('',14))+'</td>'+
        '<td class="nm">'+name+marks(r.marks)+'</td><td class="c-time mono">'+esc(r.time)+'</td></tr>'}
    function teamTable(label,rows,pane){
      if(!rows.length)return ''; // older races: often no B teams on record

      return '<table class="team" data-pane="'+pane+'"><thead><tr><th class="lead" colspan="3">'+label+'</th><th style="text-align:right;padding-right:8px">Pts</th>'+(hasSc?'<th>Scores</th>':'')+'</tr></thead><tbody>'+
        rows.map(function(t){return '<tr data-team="'+esc(t.club)+'"><td class="c-pos num">'+esc(t.pos)+'</td><td class="c-v" data-pick="'+esc(t.club)+'" title="Show only '+esc(clubs[t.club]||t.club)+'">'+vest(t.club,16)+'</td><td class="c-tn"><button type="button" class="pick" data-pick="'+esc(t.club)+'" title="Show only '+esc(clubs[t.club]||t.club)+'">'+esc(t.club)+'</button>'+
          '</td><td class="c-tp num">'+esc(t.pts)+'</td>'+(hasSc?'<td><div class="sc num">'+(t.scores||[]).map(function(s){return '<span>'+esc(s)+'</span>'}).join('')+'</div></td>':'')+'</tr>'}).join('')+'</tbody></table>'}
    var f=d.field,ind=d.individual||[];
    root.innerHTML=
      '<div class="bh-sl-head"><div class="bh-sl-meta">'+esc(d.meta)+(d.sex?' · '+esc(d.sex):'')+'</div><div class="bh-sl-venue" role="heading" aria-level="3">'+esc(d.venue)+'</div>'+
      (d.lines||[]).map(function(l){return '<div class="bh-sl-line">'+vest(l.club,14)+'<span><b>'+esc(l.strong)+'</b> '+esc(l.rest)+'</span></div>'}).join('')+
      (f?'<div class="bh-sl-fq"><button type="button" aria-expanded="false"><span style="color:var(--g5)">Field quality</span>'+
        '<span>Stacked <b class="num">'+f.stacked+'</b><span class="bh-sl-bar"><i style="width:'+f.stacked+'%"></i></span></span>'+
        '<span>Deep <b class="num">'+f.deep+'</b><span class="bh-sl-bar"><i style="width:'+f.deep+'%"></i></span></span>'+
        '<svg class="chev" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>'+
        '<div class="bh-sl-panel"><div class="sm">'+esc(f.intro)+'</div>'+f.items.map(function(it){return '<div class="t">'+esc(it[0])+' <span>· '+esc(it[1])+'</span></div><div>'+esc(it[2])+'</div>'}).join('')+
        '<div class="sm">'+esc(f.note)+'</div>'+(f.link?'<div><a href="'+esc(f.link[1])+'">'+esc(f.link[0])+'</a></div>':'')+'</div></div>':'')+
      '</div>'+
      '<div class="bh-sl-tabs" role="group" aria-label="Results view"><button type="button" aria-pressed="true" data-show="ind">Individual</button><button type="button" aria-pressed="false" data-show="a">A Teams</button>'+((d.bTeams||[]).length?'<button type="button" aria-pressed="false" data-show="b">B Teams</button>':'')+'</div>'+
      '<div class="bh-sl-cols"><div class="bh-sl-ind" data-pane="ind"><div class="bh-sl-filter" hidden><span>Showing:</span><button type="button" class="bh-sl-chip" aria-label="Show all clubs"></button></div><table class="ind"><thead><tr><th class="lead c-pos">Pos</th><th class="c-pts">Pts</th><th class="c-club">Club</th><th>Name</th><th class="c-time">Time</th></tr></thead><tbody>'+
        ind.map(indRow).join('')+'</tbody></table>'+
        (ind.length>SHOW?'<button type="button" class="bh-sl-more">Show all '+ind.length+' finishers</button>':'')+'</div>'+
      '<div class="bh-sl-teams">'+teamTable('A Teams',d.aTeams||[],'a')+teamTable('B Teams',d.bTeams||[],'b')+'</div></div>'+
      '<div class="bh-sl-src">Results from the <a href="'+esc(d.url)+'">Surrey League compendium</a>, with each runner\'s form against their last Surrey League race.</div>';
    // small spaces: one table at a time, as on the compendium
    var panes=[].slice.call(root.querySelectorAll('[data-pane]')),tabs=[].slice.call(root.querySelectorAll('.bh-sl-tabs button'));
    function show(k){panes.forEach(function(p){p.hidden=p.getAttribute('data-pane')!==k});tabs.forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-show')===k)})}
    tabs.forEach(function(b){b.addEventListener('click',function(){show(b.getAttribute('data-show'))})});show('ind');
    // "Show all" and the club filter, as on the compendium: click a club's vest or letters to see only its runners
    var more=root.querySelector('.bh-sl-more'),rows=[].slice.call(root.querySelectorAll('.ind tbody tr')),filt=root.querySelector('.bh-sl-filter'),chip=filt.querySelector('.bh-sl-chip');
    var club=null,all=false;
    function apply(){
      rows.forEach(function(r,i){r.hidden=club?r.getAttribute('data-club')!==club:(!all&&i>=SHOW)});
      if(more)more.hidden=!!club||all;

<!-- 17. Swipe through the homepage news carousel (23 Oct 2026)
     Display only. On phones and tablets the news cards follow your finger as you swipe, then settle
     on the nearest set of cards (a quick flick moves on one set). On a laptop, a sideways two-finger
     scroll on the trackpad moves one set at a time. The arrows still work as before. -->
<script>
(function(){
  function init(){
    document.querySelectorAll('.summary-block-setting-design-carousel').forEach(function(block){
      var list=block.querySelector('.summary-item-list');
      var next=block.querySelector('.summary-carousel-pager-next'),prev=block.querySelector('.summary-carousel-pager-prev');
      if(!list||!next||!prev||list.dataset.bhSwipe)return;list.dataset.bhSwipe='1';
      var STEP=101; // one set of cards, as a percentage of the list's width
      function pos(){var m=(list.style.transform||'').match(/translateX\((-?[\d.]+)%\)/);return m?parseFloat(m[1]):0}
      function go(n){var b=n>0?next:prev;for(var i=0;i<Math.abs(n);i++){if(b.classList.contains('sqs-disabled'))break;b.click()}}
      var x0,y0,t0,base,axis=null,dx=0,moved=false;
      list.addEventListener('touchstart',function(e){
        x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now();base=pos();axis=null;dx=0;moved=false;
      },{passive:true});
      list.addEventListener('touchmove',function(e){
        var mx=e.touches[0].clientX-x0,my=e.touches[0].clientY-y0;
        if(!axis){if(Math.abs(mx)<6&&Math.abs(my)<6)return;axis=Math.abs(mx)>Math.abs(my)?'x':'y'}
        if(axis!=='x')return;
        e.preventDefault();moved=true;dx=mx;
        var atStart=prev.classList.contains('sqs-disabled')&&dx>0,atEnd=next.classList.contains('sqs-disabled')&&dx<0;
        var d=(atStart||atEnd)?dx*0.3:dx; // resist at either end
        list.style.transition='none';
        list.style.transform='translateX('+(base+d/list.offsetWidth*100)+'%)';
      },{passive:false});
      list.addEventListener('touchend',function(){
        if(axis!=='x'){axis=null;return}
        axis=null;list.style.transition='';
        var w=list.offsetWidth,sets=-dx/w*100/STEP,n=Math.round(sets);
        var fast=Math.abs(dx)/Math.max(1,Date.now()-t0)>0.4;
        if(n===0&&(fast||Math.abs(dx)>w*0.2))n=dx<0?1:-1;
        var before=pos();
        if(n)go(n);
        if(pos()===before)list.style.transform='translateX('+base+'%)'; // nowhere to go: settle back
      });
      // a swipe should not also open the card it started on
      list.addEventListener('click',function(e){if(moved){e.preventDefault();e.stopPropagation();moved=false}},true);
      var wait=false;
      list.addEventListener('wheel',function(e){
        if(Math.abs(e.deltaX)<=Math.abs(e.deltaY)||Math.abs(e.deltaX)<20)return;
        e.preventDefault();if(wait)return;wait=true;go(e.deltaX>0?1:-1);setTimeout(function(){wait=false},500)
      },{passive:false});
    });
  }
  if(document.readyState==='complete')init();else window.addEventListener('load',init);
})();
</script>

<script>

<script>(function(){
  function build(){

    var sec=document.querySelector('.Header--top .Header-nav--secondary .Header-nav-inner');

    var panel=document.createElement('div');panel.className='bh-mnav-panel';panel.hidden=true;panel.id='bh-mnav-panel';nav.appendChild(panel);
    var openBtn=null;
    function close(){if(openBtn){openBtn.setAttribute('aria-expanded','false');openBtn=null;}panel.hidden=true;panel.innerHTML='';}
    function add(item,member){
      if(item.tagName==='A'){
        var a=document.createElement('a');a.href=item.getAttribute('href');a.textContent=item.textContent.trim();
        a.className='bh-mnav-item'+(member?' bh-mnav-member':'');row.appendChild(a);return;

      b.appendChild(document.createTextNode(title.textContent.trim()));
      var c=document.createElement('span');c.className='bh-caret';c.setAttribute('aria-hidden','true');b.appendChild(c);
      b._links=kids.map(function(k){return [k.getAttribute('href'),k.textContent.trim()];});
      b.addEventListener('click',function(e){
        e.stopPropagation();
        if(openBtn===b){close();return;}
        close();openBtn=b;b.setAttribute('aria-expanded','true');
        b._links.forEach(function(l){var a=document.createElement('a');a.href=l[0];a.textContent=l[1];if(l[0]===location.pathname)a.className='is-active';panel.appendChild(a);});
        panel.hidden=false;
      });
      row.appendChild(b);
    }
    [].slice.call(src.children).forEach(function(i){add(i,false);});

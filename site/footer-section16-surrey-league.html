<!-- 16. Surrey League results, compendium style (23 Oct 2026)
     Display only. Some Surrey League match reports carry the full results, laid out as on Steve's
     Surrey League compendium (slarchive.org) but in Belgrave's typefaces. The results are saved copies
     kept at github.com/stephengardner1/belgrave-harriers-data (slarchive/<article>.json), so they stay
     on our page even if the compendium moves. -->
<style>
.bh-sl{--g9:#1e1a1a;--g7:#3d3838;--g5:#6b6565;--g2:#e7e3dc;--g1:#f3f1ec;font-family:"Public Sans",system-ui,sans-serif;color:var(--g9);
  -webkit-font-smoothing:antialiased;max-width:850px;width:100%;margin:24px 0 48px;order:5}
.bh-sl *{box-sizing:border-box}
.bh-sl .num{font-variant-numeric:tabular-nums}
.bh-sl .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.bh-sl-head{margin:0 0 20px}
.bh-sl-meta{font-size:14px;line-height:20px;color:var(--g5);margin:0 0 2px}
.bh-sl-venue{font:600 28px/1.15 "Castoro Belgrave",Georgia,serif;color:var(--g9);margin:0 0 8px;letter-spacing:-.005em}
.bh-sl-line{display:flex;align-items:center;gap:6px;font-size:14px;line-height:22px;color:var(--g5);margin:0}
.bh-sl-line b{font-weight:500;color:var(--g9)}
.bh-sl-vest{display:inline-block;flex:none;vertical-align:-2px}
.bh-sl-fq{position:relative;margin:8px 0 0}
.bh-sl-fq>button{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font:inherit;font-size:12px;line-height:16px;color:#4b4646;
  background:#fff;border:1px solid var(--g2);border-radius:999px;padding:4px 8px 4px 12px;cursor:pointer}
.bh-sl-fq>button:hover{border-color:#a8a29e;color:var(--g9)}
.bh-sl-fq>button b{font-weight:600;color:var(--g9)}
.bh-sl-bar{display:inline-block;width:32px;height:6px;border-radius:999px;background:var(--g2);overflow:hidden;vertical-align:middle;margin-left:6px}
.bh-sl-bar i{display:block;height:100%;border-radius:999px;background:#57524f}
.bh-sl-fq svg.chev{transition:transform .15s}
.bh-sl-fq.open svg.chev{transform:rotate(180deg)}
.bh-sl-panel{display:none;position:absolute;z-index:20;left:0;top:calc(100% + 8px);width:min(448px,calc(100vw - 32px));background:#fff;border:1px solid var(--g2);
  border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.08);padding:12px 14px;font-size:14px;line-height:20px;color:var(--g7)}
.bh-sl-fq.open .bh-sl-panel{display:block}
.bh-sl-panel p{margin:0 0 10px}
.bh-sl-panel .sm{font-size:12px;line-height:16px;color:var(--g5)}
.bh-sl-panel .t{color:var(--g9);font-weight:600;margin:0}
.bh-sl-panel .t span{font-weight:400;color:var(--g5)}
.bh-sl-panel a{color:#7a001d;text-decoration:none}
.bh-sl-panel a:hover{text-decoration:underline}
.bh-sl-tabs{display:none;gap:0;padding:2px;border-radius:8px;background:var(--g1);margin:0 0 8px}
.bh-sl-tabs button{font:inherit;font-size:13px;font-weight:500;border:0;border-radius:6px;background:transparent;color:var(--g5);padding:4px 10px;cursor:pointer}
.bh-sl-tabs button[aria-pressed="true"]{background:#fff;color:var(--g9);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.bh-sl-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0}
.bh-sl-ind{padding-right:20px;border-right:1px solid var(--g2)}
.bh-sl-teams{padding-left:20px}
.bh-sl table{width:100%;border-collapse:collapse;margin:0;font-size:14px;line-height:20px}
.bh-sl th{text-align:left;font-size:12px;line-height:16px;font-weight:400;color:var(--g5);text-transform:uppercase;padding:6px 6px 6px 0;border-bottom:1px solid var(--g2);white-space:nowrap}
.bh-sl th.lead{font-weight:600;color:var(--g9);letter-spacing:.025em}
.bh-sl td{padding:8px 6px 8px 0;border-top:1px solid var(--g1);vertical-align:middle}
.bh-sl tbody tr:first-child td{border-top:0}
.bh-sl .ind tbody tr:hover{background:var(--g1)}
.bh-sl .c-pos{width:44px;color:var(--g7)}
.bh-sl .c-pts{width:42px;color:var(--g5)}
.bh-sl .c-club{width:62px;white-space:nowrap}
.bh-sl .c-club span{font-size:12px;color:var(--g5);margin-left:4px}
.bh-sl .c-time{width:56px;text-align:right;padding-right:0;color:var(--g7);white-space:nowrap}
.bh-sl .nm a{color:var(--g9);text-decoration:none}
.bh-sl .nm a:hover{color:#7a001d}
.bh-sl .mk{margin-left:6px;font-size:10px;vertical-align:middle;opacity:.55;cursor:default}
.bh-sl .mk.up{color:#16a34a}.bh-sl .mk.down{color:#dc2626}
.bh-sl .mk.same{font-size:12px;font-weight:600;color:var(--g5)}
.bh-sl .mk.new{font-size:14px;line-height:1;color:#1b649e;opacity:.6}
.bh-sl .mk.emo{font-size:12px;opacity:1;margin-left:4px}
.bh-sl .tag{color:var(--g5);margin-left:4px}
.bh-sl .team td{padding-top:7px;padding-bottom:7px}
.bh-sl .team .c-pos{width:24px;color:var(--g5)}
.bh-sl .team .c-v{width:22px;padding-right:4px}
.bh-sl .team .c-tn{font-weight:500;width:46px}
.bh-sl .team .c-tp{width:44px;text-align:right;padding-right:8px;font-weight:700}
.bh-sl .sc{display:flex;flex-wrap:wrap;column-gap:2px;font-size:12px;line-height:16px;color:var(--g5)}
.bh-sl .sc span{width:22px;text-align:center}
.bh-sl .team+.team{margin-top:36px}
.bh-sl .pick{display:inline-flex;align-items:center;gap:4px;font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;white-space:nowrap}
.bh-sl .pick:hover span,.bh-sl .pick:hover{color:#7a001d}
.bh-sl .c-club .pick span{margin-left:0}
.bh-sl .team .c-v{cursor:pointer}
.bh-sl .team tr.on td{background:var(--g1)}
.bh-sl-filter{display:flex;align-items:center;gap:10px;font-size:14px;line-height:20px;color:var(--g5);margin:0 0 10px}
.bh-sl-filter[hidden]{display:none}
.bh-sl-chip{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:14px;color:var(--g9);background:var(--g1);border:0;border-radius:6px;padding:4px 8px;cursor:pointer}
.bh-sl-chip:hover{background:var(--g2)}
.bh-sl-chip i{font-style:normal;color:var(--g5);font-size:16px;line-height:1;margin-left:2px}
.bh-sl-more{display:block;width:100%;margin:8px 0 0;padding:10px;font:inherit;font-size:14px;font-weight:500;color:var(--g9);background:var(--g1);border:0;border-radius:8px;cursor:pointer}
.bh-sl-more:hover{background:var(--g2)}
.bh-sl-src{font-size:13px;line-height:18px;color:var(--g5);margin:20px 0 0}
.bh-sl-src a{color:var(--g5);text-decoration:underline;text-decoration-color:#cfc9c0;text-underline-offset:2px}
.bh-sl-src a:hover{color:#7a001d}
.bh-sl button:focus-visible,.bh-sl a:focus-visible{outline:2px solid #7a001d;outline-offset:2px}
@media (max-width:820px){
  .bh-sl-tabs{display:inline-flex}
  .bh-sl-cols{display:block}
  .bh-sl-ind{padding-right:0;border-right:0}
  .bh-sl-teams{padding-left:0}
  .bh-sl [data-pane][hidden]{display:none}
  .bh-sl .team+.team{margin-top:0}
  .bh-sl .c-pos{width:34px}.bh-sl .c-pts{width:32px}.bh-sl .c-club{width:58px}
  .bh-sl .nm{font-size:13px}
}
@media (min-width:821px){.bh-sl [data-pane][hidden]{display:block}}
@media (max-width:420px){.bh-sl .sc span{width:20px}.bh-sl .team .c-pos{width:20px}.bh-sl .team .c-tn{width:40px}.bh-sl .team .c-tp{width:40px;padding-right:6px}.bh-sl-venue{font-size:24px}}
</style>
<script>
(function(){
  var article=document.querySelector('.BlogItem');if(!article)return;
  var layout=article.querySelector('.sqs-layout');if(!layout)return;
  var slug=location.pathname.replace(/\/$/,'').split('/').pop();
  var DATA='https://stephengardner1.github.io/belgrave-harriers-data/slarchive/';
  var SHOW=50; // finishers shown before "Show all"
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  fetch(DATA+encodeURIComponent(slug)+'.json').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
    if(!document.querySelector('link[href*="IBM+Plex+Mono"]')){var f=document.createElement('link');f.rel='stylesheet';
      f.href='https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap';document.head.appendChild(f)}
    var n=0,clubs=d.clubs||{};
    function vest(c,size){var s=(d.vests||{})[c]||d.vests[''];if(!s)return'';n++;
      return s.replace('<svg','<svg class="bh-sl-vest" width="'+size+'" height="'+size+'" aria-hidden="true"').replace(/VID/g,'bhv'+n)}
    function slugName(nm){return nm.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'')}
    function marks(ms){return (ms||[]).map(function(m){
      var t=m.t,ti=m.title?' title="'+esc(m.title)+'" aria-label="'+esc(m.title)+'"':'';
      if(t.charAt(0)==='(')return '<span class="tag">'+esc(t)+'</span>';
      var k=t==='▲'?'up':t==='▼'?'down':t==='='?'same':t==='✦'?'new':'emo';
      return '<span class="mk '+k+'"'+ti+'>'+esc(t)+'</span>'}).join('')}
    function indRow(r,i){
      var name=r.name==='Unknown'?'<span style="color:var(--g5)">Unknown</span>':'<a href="'+(d.athleteBase||'https://slarchive.org/athlete/')+slugName(r.ath||r.name)+'">'+esc(r.name)+'</a>';
      return '<tr data-club="'+esc(r.club)+'"'+(i>=SHOW?' hidden':'')+'><td class="c-pos num">'+esc(r.pos)+'</td><td class="c-pts num">'+esc(r.pts)+'</td>'+
        '<td class="c-club">'+(r.club?'<button type="button" class="pick" data-pick="'+esc(r.club)+'" title="Show only '+esc(clubs[r.club]||r.club)+'">'+vest(r.club,14)+'<span>'+esc(r.club)+'</span></button>':vest('',14))+'</td>'+
        '<td class="nm">'+name+marks(r.marks)+'</td><td class="c-time mono">'+esc(r.time)+'</td></tr>'}
    function teamTable(label,rows,pane){
      return '<table class="team" data-pane="'+pane+'"><thead><tr><th class="lead" colspan="3">'+label+'</th><th style="text-align:right;padding-right:8px">Pts</th><th>Scores</th></tr></thead><tbody>'+
        rows.map(function(t){return '<tr data-team="'+esc(t.club)+'"><td class="c-pos num">'+esc(t.pos)+'</td><td class="c-v" data-pick="'+esc(t.club)+'" title="Show only '+esc(clubs[t.club]||t.club)+'">'+vest(t.club,16)+'</td><td class="c-tn"><button type="button" class="pick" data-pick="'+esc(t.club)+'" title="Show only '+esc(clubs[t.club]||t.club)+'">'+esc(t.club)+'</button>'+
          '</td><td class="c-tp num">'+esc(t.pts)+'</td><td><div class="sc num">'+t.scores.map(function(s){return '<span>'+esc(s)+'</span>'}).join('')+'</div></td></tr>'}).join('')+'</tbody></table>'}
    var f=d.field,ind=d.individual||[];
    var box=document.createElement('section');box.className='bh-sl';box.setAttribute('aria-label','Results');
    box.innerHTML=
      '<div class="bh-sl-head"><p class="bh-sl-meta">'+esc(d.meta)+'</p><h2 class="bh-sl-venue">'+esc(d.venue)+'</h2>'+
      (d.lines||[]).map(function(l){return '<p class="bh-sl-line">'+vest(l.club,14)+'<span><b>'+esc(l.strong)+'</b> '+esc(l.rest)+'</span></p>'}).join('')+
      (f?'<div class="bh-sl-fq"><button type="button" aria-expanded="false"><span style="color:var(--g5)">Field quality</span>'+
        '<span>Stacked <b class="num">'+f.stacked+'</b><span class="bh-sl-bar"><i style="width:'+f.stacked+'%"></i></span></span>'+
        '<span>Deep <b class="num">'+f.deep+'</b><span class="bh-sl-bar"><i style="width:'+f.deep+'%"></i></span></span>'+
        '<svg class="chev" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>'+
        '<div class="bh-sl-panel"><p class="sm">'+esc(f.intro)+'</p>'+f.items.map(function(it){return '<p class="t">'+esc(it[0])+' <span>· '+esc(it[1])+'</span></p><p>'+esc(it[2])+'</p>'}).join('')+
        '<p class="sm">'+esc(f.note)+'</p>'+(f.link?'<p style="margin:0"><a href="'+esc(f.link[1])+'">'+esc(f.link[0])+'</a></p>':'')+'</div></div>':'')+
      '</div>'+
      '<div class="bh-sl-tabs" role="group" aria-label="Results view"><button type="button" aria-pressed="true" data-show="ind">Individual</button><button type="button" aria-pressed="false" data-show="a">A Teams</button><button type="button" aria-pressed="false" data-show="b">B Teams</button></div>'+
      '<div class="bh-sl-cols"><div class="bh-sl-ind" data-pane="ind"><div class="bh-sl-filter" hidden><span>Showing:</span><button type="button" class="bh-sl-chip" aria-label="Show all clubs"></button></div><table class="ind"><thead><tr><th class="lead c-pos">Pos</th><th class="c-pts">Pts</th><th class="c-club">Club</th><th>Name</th><th class="c-time">Time</th></tr></thead><tbody>'+
        ind.map(indRow).join('')+'</tbody></table>'+
        (ind.length>SHOW?'<button type="button" class="bh-sl-more">Show all '+ind.length+' finishers</button>':'')+'</div>'+
      '<div class="bh-sl-teams">'+teamTable('A Teams',d.aTeams||[],'a')+teamTable('B Teams',d.bTeams||[],'b')+'</div></div>'+
      '<p class="bh-sl-src">Results from the <a href="'+esc(d.url)+'">Surrey League compendium</a>, with each runner\'s form against their last Surrey League race.</p>';
    // small screens: one table at a time, as on the compendium
    var panes=[].slice.call(box.querySelectorAll('[data-pane]')),tabs=[].slice.call(box.querySelectorAll('.bh-sl-tabs button'));
    function show(k){panes.forEach(function(p){p.hidden=p.getAttribute('data-pane')!==k});tabs.forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-show')===k)})}
    tabs.forEach(function(b){b.addEventListener('click',function(){show(b.getAttribute('data-show'))})});show('ind');
    // "Show all" and the club filter, as on the compendium: click a club's vest or letters to see only its runners
    var more=box.querySelector('.bh-sl-more'),rows=[].slice.call(box.querySelectorAll('.ind tbody tr')),filt=box.querySelector('.bh-sl-filter'),chip=filt.querySelector('.bh-sl-chip');
    var club=null,all=false;
    function apply(){
      rows.forEach(function(r,i){r.hidden=club?r.getAttribute('data-club')!==club:(!all&&i>=SHOW)});
      if(more)more.hidden=!!club||all;
      filt.hidden=!club;
      if(club)chip.innerHTML=vest(club,14)+esc(clubs[club]||club)+'<i aria-hidden="true">×</i>';
      [].slice.call(box.querySelectorAll('tr[data-team]')).forEach(function(t){t.classList.toggle('on',t.getAttribute('data-team')===club)});
    }
    if(more)more.addEventListener('click',function(){all=true;apply()});
    chip.addEventListener('click',function(){club=null;apply()});
    box.addEventListener('click',function(e){var p=e.target.closest('[data-pick]');if(!p||!box.contains(p))return;
      var c=p.getAttribute('data-pick');club=club===c?null:c;apply();
      if(p.closest('.team')){show('ind');var top=box.querySelector('.bh-sl-ind').getBoundingClientRect().top;if(top<80||top>innerHeight-100)window.scrollBy({top:top-100,behavior:'smooth'})}});
    apply();
    var fq=box.querySelector('.bh-sl-fq');
    if(fq){var fb=fq.querySelector('button');
      fb.addEventListener('click',function(e){e.stopPropagation();var o=fq.classList.toggle('open');fb.setAttribute('aria-expanded',o)});
      document.addEventListener('click',function(e){if(!fq.contains(e.target)){fq.classList.remove('open');fb.setAttribute('aria-expanded','false')}});
      document.addEventListener('keydown',function(e){if(e.key==='Escape'){fq.classList.remove('open');fb.setAttribute('aria-expanded','false')}})}
    layout.parentNode.insertBefore(box,layout.nextSibling);
  }).catch(function(){});
})();
</script>

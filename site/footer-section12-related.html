<!-- 12. Related article cards (23 Oct 2026)
     Display only. Some articles list related articles (for example, earlier wins of the same title).
     They are shown as cards in the right-hand margin on wide screens, or after the article on narrower
     ones. The list lives at github.com/stephengardner1/belgrave-harriers-data (related/<article>.json);
     titles, dates and photos are read live from each article. -->
<style>
.bh-rel{font-family:"Public Sans",system-ui,sans-serif;color:#1e1a1a;-webkit-font-smoothing:antialiased}
.bh-rel-head{font:600 12px/16px "Public Sans",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#5c5555;margin:0 0 12px;padding:0 0 10px;
  border-bottom:3px solid #d6b97a;border-image:linear-gradient(135deg,#e7d8b0 0%,#d6b97a 28%,#d5b271 54%,#d09d55 93%,#ce954a 100%) 1}
.bh-rel-card{display:block;text-decoration:none!important;color:inherit;margin:0 0 24px}
.bh-rel-img{aspect-ratio:3/2;overflow:hidden;background:#f5efe4;margin:0 0 10px}
.bh-rel-img img{display:block;width:100%;height:100%;object-fit:cover}
.bh-rel-date{display:block;font:500 12px/16px "Public Sans",sans-serif;letter-spacing:.04em;color:#5c5555;margin:0 0 4px}
.bh-rel-title{display:block;font:600 18px/1.25 "Castoro Belgrave",Georgia,serif;color:#1e1a1a}
.bh-rel-card:hover .bh-rel-title{color:#7a001d}
.bh-rel-card:focus-visible{outline:2px solid #7a001d;outline-offset:4px}
.bh-rel.side{position:absolute;z-index:2}
.bh-rel.below{max-width:850px;width:100%;margin:8px 0 40px;order:6}
.bh-rel.below .bh-rel-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:24px}
.bh-rel.below .bh-rel-card{margin:0}
</style>
<script>
(function(){
  var article=document.querySelector('.BlogItem');if(!article)return;
  var layout=article.querySelector('.sqs-layout');if(!layout)return;
  var slug=location.pathname.replace(/\/$/,'').split('/').pop();
  var BASE='https://stephengardner1.github.io/belgrave-harriers-data/';
  var MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  fetch(BASE+'related/'+encodeURIComponent(slug)+'.json').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(rel){
    var list=(rel.articles||[]).slice(0,4);if(!list.length)return;
    return Promise.all(list.map(function(s){
      return fetch('/news/'+s+'?format=json').then(function(r){return r.ok?r.json():null}).then(function(j){
        if(!j||!j.item)return null;var it=j.item;
        var img=(it.assetUrl||'');if(!/\/[^\/]+\.[a-z]{3,4}$/i.test(img.split('?')[0]))img='';
        return {href:it.fullUrl||('/news/'+s),title:it.title,date:new Date(it.publishOn),img:img};
      }).catch(function(){return null});
    })).then(function(cards){
      cards=cards.filter(Boolean);if(!cards.length)return;
      var box=document.createElement('aside');box.className='bh-rel';box.setAttribute('aria-label',rel.heading||'Related articles');
      box.innerHTML='<p class="bh-rel-head">'+esc(rel.heading||'Related articles')+'</p><div class="bh-rel-cards">'+cards.map(function(c){
        return '<a class="bh-rel-card" href="'+esc(c.href)+'">'+(c.img?'<span class="bh-rel-img"><img src="'+esc(c.img)+'?format=500w" alt="" loading="lazy"></span>':'')+
          '<span class="bh-rel-date">'+c.date.getDate()+' '+MON[c.date.getMonth()]+' '+c.date.getFullYear()+'</span><span class="bh-rel-title">'+esc(c.title)+'</span></a>'}).join('')+'</div>';
      function place(){
        box.classList.remove('side','below');box.style.cssText='';
        var lr=layout.getBoundingClientRect(),ar=article.getBoundingClientRect();
        var ref=document.querySelector('.BlogItem-pagination')||document.querySelector('.Main-content');
        var edge=ref.getBoundingClientRect().right,gap=40,w=Math.min(260,edge-lr.right-gap);
        if(w>=200){
          if(box.parentNode!==article)article.appendChild(box);
          if(getComputedStyle(article).position==='static')article.style.position='relative';
          box.classList.add('side');box.style.width=w+'px';
          box.style.left=(lr.right+gap-ar.left)+'px';box.style.top=(lr.top-ar.top)+'px';
          // stay clear of wide results tables that run into the margin
          var b=box.getBoundingClientRect(),clash=[].slice.call(article.querySelectorAll('.bh-scroll')).some(function(s){
            var r=s.getBoundingClientRect();return r.right>b.left&&r.top<b.bottom+24&&r.bottom>b.top});
          if(!clash)return;
          box.classList.remove('side');box.style.cssText='';
        }
        box.classList.add('below');layout.parentNode.insertBefore(box,layout.nextSibling);
      }
      place();
      var t;window.addEventListener('resize',function(){clearTimeout(t);t=setTimeout(place,200)});
      setTimeout(place,1500); // again once photos and results tables have settled
    });
  }).catch(function(){});
})();
</script>
